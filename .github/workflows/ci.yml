name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  cli-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python CLI selftest
        run: python3 tools/fastdrop.py selftest
      # The Mac-CLI scenarios report SKIP here because there is no Swift build; the Python ones run.
      - name: Interop scenarios (loopback only)
        run: python3 tools/interop_test.py

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Package.swift needs swift-tools-version 6.0 and Swift Testing (Xcode 16+).
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Swift version
        run: swift --version

      - name: Build, test and selftest
        working-directory: mac
        run: |
          swift build
          swift test
          swift run fastdrop-cli selftest

      - name: Python CLI selftest and interop (includes the Mac CLI scenarios)
        run: |
          python3 tools/fastdrop.py selftest
          python3 tools/interop_test.py

      - name: Package the app (build-app.sh, ad-hoc signed)
        working-directory: mac
        run: scripts/build-app.sh
