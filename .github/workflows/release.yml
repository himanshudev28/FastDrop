name: Build & Release APK

# Push a tag like v2.1 to build the APK and publish it as a GitHub Release.
# "Run workflow" (manual) builds the APK and attaches it to the run as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fastdrop.keystore"
            echo "FASTDROP_KEYSTORE=$RUNNER_TEMP/fastdrop.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set. The APK is signed with a throwaway debug key and won't update existing installs."
          fi

      - name: Build release APK
        env:
          FASTDROP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FASTDROP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FASTDROP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK and checksum
        run: |
          NAME="FastDrop-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/fastdrop.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FastDrop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          body: |
            ## 📦 Install
            Download **${{ env.APK_NAME }}** below, copy it to your Android phone or TV, and open it (or `adb install ${{ env.APK_NAME }}`).
            Works on Android 5.0+ and Android TV. You may need to allow "Install unknown apps".
