name: Build & Release APK

# Push a tag like v2.1 to build the APK and publish it as a GitHub Release (the mac job then adds FastDrop-mac.zip).
# "Run workflow" (manual) builds the APK and attaches it to the run as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(sed -nE 's/.*versionName *= *"([^"]+)".*/\1/p' app/build.gradle.kts)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fastdrop.keystore"
            echo "FASTDROP_KEYSTORE=$RUNNER_TEMP/fastdrop.keystore" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Refusing to publish a release APK signed with a throwaway debug key (it can't update existing installs). Add the signing secrets and re-run."
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 secret not set. This manual run signs the APK with a throwaway debug key; it won't update existing installs and is only attached to the run."
          fi

      - name: Build release APK
        env:
          FASTDROP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FASTDROP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FASTDROP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK and checksum
        run: |
          NAME="FastDrop-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/fastdrop.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FastDrop ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ env.APK_NAME }}
            ${{ env.APK_NAME }}.sha256
          body: |
            ## 📦 Install
            Download **${{ env.APK_NAME }}** below, copy it to your Android phone or TV, and open it (or `adb install ${{ env.APK_NAME }}`).
            Works on Android 5.0+ and Android TV. You may need to allow "Install unknown apps".

  # Runs after the Android job so the GitHub Release already exists when the Mac zip is attached
  # (no race between two jobs creating the same release).
  mac:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # Universal (arm64 + x86_64). Ad-hoc signed unless a "FastDrop Dev" identity exists (it won't on a runner).
      # Not notarized.
      - name: Build FastDrop.app
        working-directory: mac
        run: scripts/build-app.sh

      - name: Check the binary is universal
        working-directory: mac/build
        run: |
          ARCHS=$(lipo -archs FastDrop.app/Contents/MacOS/FastDrop)
          echo "architectures: $ARCHS"
          case "$ARCHS" in *arm64*x86_64*|*x86_64*arm64*) ;; *) echo "::error::Expected a universal binary, got: $ARCHS"; exit 1 ;; esac

      - name: Zip and checksum
        working-directory: mac/build
        run: |
          ditto -c -k --keepParent FastDrop.app FastDrop-mac.zip
          shasum -a 256 FastDrop-mac.zip > FastDrop-mac.zip.sha256
          cat FastDrop-mac.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: FastDrop-mac
          path: |
            mac/build/FastDrop-mac.zip
            mac/build/FastDrop-mac.zip.sha256

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mac/build/FastDrop-mac.zip
            mac/build/FastDrop-mac.zip.sha256
